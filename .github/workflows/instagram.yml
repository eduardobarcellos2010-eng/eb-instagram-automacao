name: Instagram EB
on:
  workflow_dispatch:
    inputs:
      operation:
        description: publicar, agendar ou aguardar
        required: true
        type: choice
        options: [publicar, agendar, aguardar, verificar, diagnosticar]
      post_id:
        required: true
        type: string
      scheduled_at:
        description: YYYY-MM-DDTHH:MM (America/Sao_Paulo)
        required: false
        type: string
permissions:
  actions: write
  contents: write
jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Executar publicacao ou agenda
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "38809152418675604"
        run: python scripts/instagram_publish.py --operation "${{ inputs.operation }}" --post-id "${{ inputs.post_id }}" --scheduled-at "${{ inputs.scheduled_at }}"
      - name: Salvar agenda
        run: |
          git config user.name 'EB Automacao'
          git config user.email 'actions@github.com'
          git add automation/agenda.json
          git diff --cached --quiet || git commit -m 'Atualiza agenda do Instagram'
          git push
      - name: Aguardar horario agendado
        if: ${{ inputs.operation == 'agendar' || inputs.operation == 'aguardar' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/wait_for_schedule.py --post-id "${{ inputs.post_id }}" --scheduled-at "${{ inputs.scheduled_at }}"
      - name: Salvar resultado da publicacao
        if: ${{ inputs.operation == 'agendar' || inputs.operation == 'aguardar' }}
        run: |
          git config user.name 'EB Automacao'
          git config user.email 'actions@github.com'
          git add automation/agenda.json
          git diff --cached --quiet || git commit -m 'Registra publicacao do Instagram'
          git push
