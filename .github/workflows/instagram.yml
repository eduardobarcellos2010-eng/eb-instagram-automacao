name: Instagram EB
on:
  workflow_dispatch:
    inputs:
      operation:
        description: publicar, agendar, processar ou verificar
        required: true
        type: choice
        options: [publicar, agendar, processar, verificar, diagnosticar]
      post_id:
        required: false
        type: string
      scheduled_at:
        description: YYYY-MM-DDTHH:MM (America/Sao_Paulo)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: instagram-agenda
  cancel-in-progress: false
jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Executar publicacao ou agenda
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "38809152418675604"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/instagram_publish.py --operation processar
          else
            python scripts/instagram_publish.py --operation "${{ inputs.operation }}" --post-id "${{ inputs.post_id }}" --scheduled-at "${{ inputs.scheduled_at }}"
          fi
      - name: Salvar alteracao de agenda
        run: |
          git config user.name 'EB Automacao'
          git config user.email 'actions@github.com'
          git add automation/agenda.json
          if git diff --cached --quiet; then
            echo 'AGENDA_SEM_ALTERACAO'
            exit 0
          fi
          git commit -m 'Atualiza agenda do Instagram'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
