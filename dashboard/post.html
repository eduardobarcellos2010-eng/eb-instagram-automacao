<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EB | Prévia de postagem</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#07152e;font-family:Arial,sans-serif}.top{padding:16px 5vw}.back{color:#765c2c;font-weight:700;text-decoration:none}.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:24px;padding:0 5vw 36px}.post,.copy{background:#fff;border:1px solid #d8d4ca;border-radius:12px;overflow:hidden}.head{padding:14px 18px;font-weight:700;border-bottom:1px solid #e6e3dc}.head small{display:block;color:#667085;font-weight:400;margin-top:3px}iframe{display:block;width:100%;height:680px;border:0}.copy{padding:26px}.copy h1{font:28px Georgia,serif;margin:0 0 18px}.copy div{white-space:pre-wrap;line-height:1.58;color:#344054}@media(max-width:850px){.wrap{grid-template-columns:1fr}iframe{height:560px}}</style>
</head>
<body>
<header class="top"><a class="back" href="./">← Voltar ao painel</a></header>
<main class="wrap"><section class="post"><div class="head">@eduardobarcellos <small>Prévia de postagem</small></div><iframe id="visual" title="Prévia do carrossel"></iframe></section><section class="copy"><h1 id="title"></h1><div id="caption"></div></section></main>
<script>const id=Number(new URLSearchParams(location.search).get('id'));fetch('posts.json').then(r=>r.json()).then(posts=>{const p=posts.find(x=>x.id===id)||posts[0];document.getElementById('title').textContent=p.title;document.getElementById('caption').textContent=p.copy;document.getElementById('visual').src=p.preview})</script>
</body></html>
