<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EB | Central de Conte?do</title><style>:root{--n:#07152e;--g:#c0a062}*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#07152e;font-family:Arial,sans-serif}header{padding:34px 8%;background:var(--n);color:#fff;display:flex;justify-content:space-between}h1,h2{font-family:Georgia}.wrap{max-width:1160px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:8px;border:1px solid #dce1e9}small{color:#92733b;font-weight:bold;letter-spacing:1px}.ok{color:#337350;font-size:12px}button{margin:12px 6px 0 0;padding:9px;border:1px solid #c0a062;background:#fff;color:#765c2c;border-radius:4px;font-weight:bold;cursor:pointer}.primary{background:var(--n);color:#fff;border-color:var(--n)}dialog{width:min(620px,92vw);border:0;border-radius:10px;padding:26px;color:var(--n)}dialog::backdrop{background:#07152e99}.slide{padding:12px;border-bottom:1px solid #e8ebf0;line-height:1.35}.slide b{color:#92733b;margin-right:8px}#close{float:right}</style></head><body><header><div><h1>EB Viagens & Gest?o de Milhas</h1><small>CENTRAL DE CONTE?DO</small></div><div><b>15</b> aprovados &nbsp; <b>0</b> agendados</div></header><main class="wrap"><h2>Conte?dos aprovados</h2><section class="grid" id="grid"></section></main><dialog id="modal"><button id="close" onclick="modal.close()">Fechar</button><h2 id="mtitle"></h2><div id="slides"></div></dialog><script>const posts=[{"id": 1, "title": "Carrossel 01 · benefícios invisíveis", "slides": ["Seu banco pode ter R$ 200 por mês escondidos. E você pode nunca ter percebido.", "Economizar não é só cortar gastos. Muitas vezes, é encontrar benefícios que você já conquistou.", "R$ 200 por mês. Foi o que um cliente encontrou em menos de um minuto, dentro do próprio aplicativo do banco.", "“Eu nunca tinha visto isso.” O dinheiro não apareceu naquele momento. Ele sempre esteve lá.", "Gastar mais não significa extrair mais valor. Sem estratégia, benefícios, pontos e vantagens ficam parados.", "Quantos benefícios você nem sabe que existem? Seu cartão e seu banco podem estar trabalhando bem menos do que deveriam.", "Você cuida do negócio. Eu cuido do valor que ele gera. Envie DIAGNÓSTICO no direct para entender o potencial do seu cartão."], "preview": "carrosseis/roteiro-01-beneficios-ocultos/index.html"}, {"id": 2, "title": "Carrossel 02 · gastar muito, extrair pouco", "slides": ["Você gasta R$ 40 mil por mês. Mas sabe o que isso te devolve?", "O maior desperdício não está em quem gasta pouco. Está em quem movimenta muito dinheiro sem uma estratégia clara.", "“Quanto você gasta?” nunca é a primeira pergunta. O que importa é entender como esse dinheiro está sendo usado.", "Vários cartões. Canais errados. Benefícios esquecidos. Pequenas decisões que, juntas, custam muito.", "Gastar muito e extrair pouco valor é um custo invisível. Seu volume financeiro pode abrir portas que hoje continuam fechadas.", "O problema não é o limite do cartão. É a falta de estratégia. Pontos, benefícios e relacionamento precisam trabalhar juntos.", "Seu cartão deve trabalhar para você. Envie DIAGNÓSTICO no direct e eu analiso o potencial da sua estratégia."], "preview": "carrosseis/roteiro-02-gastar-muito-extrair-pouco/index.html"}, {"id": 3, "title": "Carrossel 03 · eu não fazia ideia disso", "slides": ["“Eu não fazia ideia disso. ” É uma frase que eu escuto praticamente toda semana.", "Ela não aparece depois de uma promoção de milhas. Aparece quando o cliente entende quanto valor deixou na mesa.", "Às vezes é um benefício que sempre esteve ali. Só faltava alguém para enxergar e colocar em prática.", "Um cartão mal usado. Uma compra pelo canal errado. O desperdício quase sempre acontece sem que a pessoa perceba.", "Milhas não são o problema. O problema é não ter uma estratégia para fazer seus recursos trabalharem juntos.", "Os benefícios aparecem naturalmente. Porque cada compra, ponto e vantagem passa a ter uma direção.", "A maior economia vem de gastar melhor. Envie DIAGNÓSTICO no direct e eu analiso sua estratégia."], "preview": "carrosseis/roteiro-03-eu-nao-fazia-ideia-disso/index.html"}, {"id": 4, "title": "Carrossel 04 · cartão melhor ou estratégia?", "slides": ["“Eu preciso de um cartão melhor. ” Foi assim que um cliente começou uma consultoria.", "Não. O problema é outro. Trocar de cartão não resolveria absolutamente nada naquele caso.", "Existe uma crença forte de que tudo começa pelo cartão. Mas cartão é ferramenta. Não é estratégia.", "Os mesmos gastos. Os mesmos canais. O mesmo resultado. Sem planejamento, o cartão novo apenas repete o problema antigo.", "Trocar o volante não faz o carro andar mais rápido. Primeiro você precisa saber para onde está indo.", "O cartão importa. Mas nunca trabalha sozinho. Compras, benefícios, relacionamento e pontos precisam estar conectados.", "O problema não é o cartão. É a estratégia por trás dele. Envie DIAGNÓSTICO no direct e eu analiso sua estratégia."], "preview": "carrosseis/roteiro-04-cartao-melhor-ou-estrategia/index.html"}, {"id": 5, "title": "Carrossel 05 · o silêncio na consultoria", "slides": ["Existe um momento que se repete em quase toda consultoria. É quando o cliente faz silêncio.", "Ele vem depois de perguntas simples. Qual cartão você usa? Onde costuma comprar? Você concentra os gastos? “Nunca parei para pensar nisso.”", "Essa frase muda a conversa. O problema não era viajar caro. Era tomar pequenas decisões sem estratégia.", "Separadas, parecem irrelevantes. Juntas, podem representar milhares de reais ao longo do ano. As melhores consultorias começam quando o cliente percebe que olhava para o lugar errado.", "Oportunidade aparece quando existe clareza. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-05-silencio-consultoria/index.html"}, {"id": 6, "title": "Carrossel 06 · você não precisa aprender milhas", "slides": ["Talvez esta seja a notícia mais importante para quem quer viajar melhor. Você não precisa aprender milhas.", "Você não precisa acompanhar promoções todos os dias, nem saber cada campanha ou cartão. Você faz sua própria contabilidade?", "Cuida sozinho do planejamento tributário e de todos os investimentos? Seu tempo tem valor. E é por isso que você delega o que exige especialização.", "Com milhas, acontece exatamente a mesma coisa. O desafio não é informação. É transformar informação em estratégia.", "Milhas devem devolver tempo para você. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-06-voce-nao-precisa-aprender-milhas/index.html"}, {"id": 7, "title": "Carrossel 07 · milhas não são o produto", "slides": ["“Qual é o melhor cartão?” quase nunca é a pergunta certa. Milhas são uma consequência.", "Elas aparecem quando existe organização financeira, relacionamento bancário e planejamento. Lucro é consequência de uma empresa bem administrada.", "Com milhas, a lógica é a mesma. Quem começa pelo cartão termina preso ao cartão.", "Quem começa pela estratégia constrói um sistema. O objetivo não é acumular mais milhas.", "É extrair mais valor do dinheiro que já circula na sua vida. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-07-milhas-nao-sao-produto/index.html"}, {"id": 8, "title": "Carrossel 08 · seu problema não é emitir passagens", "slides": ["A emissão é apenas a última etapa da estratégia. Seu problema não é emitir passagens.", "Quando você começa a procurar a passagem, muitas vezes já chegou tarde. A viagem começou meses antes.", "Na escolha do cartão, no canal de compra e nos benefícios ignorados. Pontos que expiram. Compras sem estratégia. Decisões que vêm antes.", "O resultado é consequência de tudo que aconteceu antes. Administrar apenas a viagem economiza uma vez.", "Administrar o processo inteiro economiza sempre. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-08-problema-nao-e-emitir/index.html"}, {"id": 9, "title": "Carrossel 09 · dica ou estratégia", "slides": ["Uma dica resolve hoje. Estratégia continua resolvendo daqui a cinco anos. Dicas envelhecem.", "Promoções acabam. Cartões mudam. Regras mudam. Uma estratégia continua funcionando.", "Porque ela olha para como você compra, viaja e se relaciona com os bancos. Não é só sobre pontos. É sobre a equação inteira.", "Quem procura a próxima promoção depende da sorte. Quem constrói estratégia depende muito menos dela.", "Não entregue seu resultado ao acaso. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-09-dica-ou-estrategia/index.html"}, {"id": 10, "title": "Carrossel 10 · o que compram na gestão", "slides": ["Quando alguém contrata uma gestão, não está comprando milhas. Está comprando clareza.", "Organização. Antecipação. Decisões melhores antes que as oportunidades passem. Também está comprando alguém que evita desperdícios invisíveis.", "E transforma dezenas de pequenas decisões em uma estratégia única. É como um assessor financeiro.", "Você não o contrata porque não sabe abrir um aplicativo. Contrata porque quer decidir melhor.", "No fim, gestão não entrega passagens. Entrega eficiência. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-10-o-que-compram-na-gestao/index.html"}, {"id": 11, "title": "Carrossel 11 · a porta de entrada", "slides": ["Duas pessoas compram o mesmo produto. Uma ganha cinco vezes mais pontos. Sem gastar um real a mais.", "A diferença não está no produto nem no vendedor. Uma entra direto no site. A outra usa um portal parceiro.", "Mesmo produto. Mesmo preço. Mais pontos. A estratégia começa antes do clique.", "Não é sobre comprar mais. É sobre comprar pelo caminho certo. A diferença nunca esteve no produto.", "Ela estava na porta de entrada. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-11-porta-de-entrada/index.html"}, {"id": 12, "title": "Carrossel 12 · quanto vale um clique", "slides": ["Esse clique pode valer milhares de pontos. E a maioria faz o clique errado.", "Entrar direto no site e entrar pelo portal parceiro parecem a mesma coisa. Mas não são.", "Mesmo produto. Mesmo valor. Retorno diferente. O cartão participa de uma pequena parte da estratégia.", "O restante acontece antes. Quem muda o caminho muda o resultado.", "Seu próximo clique pode valer mais do que parece. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-12-quanto-vale-um-clique/index.html"}, {"id": 13, "title": "Carrossel 13 · benefícios do banco", "slides": ["Se eu pegar seu celular agora, podemos encontrar benefícios que você nunca usou. Eles já podem estar no seu aplicativo.", "Pouca gente entra nas áreas de benefícios, vantagens e relacionamento. É onde surgem vouchers, descontos e serviços já disponíveis.", "Cada banco tem suas regras. Mas a maioria das pessoas não explora nenhuma. Por isso, oportunidades passam despercebidas.", "Às vezes, o dinheiro que você procura já está no aplicativo que abre todos os dias. A pergunta é: você sabe onde procurar?", "Benefícios não usados também têm valor. Entender o cenário é o primeiro passo para aproveitar melhor.", "Benefícios não usados também têm valor. Envie DIAGNÓSTICO no direct e eu analiso sua estratégia."], "preview": "carrosseis/roteiro-13-beneficios-do-banco/index.html"}, {"id": 14, "title": "Carrossel 14 · mudar um detalhe", "slides": ["Mesmo produto. Mesmo preço. Mas um detalhe muda tudo. O caminho da compra.", "Ao passar por um parceiro estratégico, a lógica muda completamente. Porque não olhamos apenas para o preço.", "Preço. Pontuação. Benefícios. Relacionamento. Tudo entra na conta. É assim que uma compra comum passa a devolver mais valor.", "Comprar é fácil. Comprar estrategicamente é outra história.", "Cada compra pode ter uma estratégia. Entender o cenário é o primeiro passo para aproveitar melhor.", "Cada compra pode ter uma estratégia. Envie DIAGNÓSTICO no direct e eu analiso sua estratégia."], "preview": "carrosseis/roteiro-14-mudar-um-detalhe/index.html"}, {"id": 15, "title": "Carrossel 15 · como analiso uma compra", "slides": ["“Vale a pena comprar agora?” nunca é a primeira tela que eu abro. Preço não é o único critério.", "Existe campanha ativa? Portal bonificado? Benefício bancário? Vale esperar? A pergunta não é só quanto custa.", "É se existe uma forma mais inteligente de fazer a mesma compra. Essa análise leva poucos minutos.", "Mas pode mudar todo o retorno daquela decisão. Gestão não é caçar promoções aleatórias.", "É tomar decisões melhores antes de gastar. Entender o cenário é o primeiro passo para aproveitar melhor.", "Vamos olhar sua estratégia? Envie DIAGNÓSTICO no direct e eu analiso seu potencial."], "preview": "carrosseis/roteiro-15-como-analiso-uma-compra/index.html"}];const g=document.querySelector('#grid');g.innerHTML=posts.map(p=>`<article class="card"><small>CARROSSEL ${String(p.id).padStart(2,'0')}</small><h2>${p.title}</h2><span class="ok">? APROVADO</span><p><button onclick="go(${p.id})">Ver visual</button><button onclick="view(${p.id})">Ver texto</button><button>Agendar</button><button class="primary">Postar agora</button></p></article>`).join('');function go(id){location.href='post.html?id='+id}function view(id){const p=posts.find(x=>x.id===id);mtitle.textContent=p.title;slides.innerHTML=p.slides.map((s,i)=>`<div class="slide"><b>SLIDE ${i+1}</b>${s}</div>`).join('');modal.showModal()}</script></body></html>
